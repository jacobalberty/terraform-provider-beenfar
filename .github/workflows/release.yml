name: Release

# Every push to main runs CI (ci.yml, acceptance tests included) and then
# releases automatically when the conventional commits since the last tag
# call for it: ietf-tools/semver-action computes the version, then the commit
# is tagged and a GitHub release is published with notes generated by
# git-cliff (cliff.toml).
#
# Version rules: feat bumps minor, fix and perf bump patch, other types do
# not release. Breaking changes bump the minor version while 0.x; v1.0.0 and
# new major versions are only released by hand. Tag v0.0.0 marks the initial
# commit as the baseline: semver-action compares against an existing tag, so
# it must stay.
#
# This only tags and publishes release notes. Building and signing provider
# binaries for the Terraform and OpenTofu registries (goreleaser) is a
# follow-up.
#
# Run it by hand (workflow dispatch) with a version to cut a release the
# script will not, e.g. v1.0.0.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (vX.Y.Z). Leave empty to compute it.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version from conventional commits
        id: semver
        if: inputs.version == ''
        uses: ietf-tools/semver-action@v1.12.0
        with:
          token: ${{ github.token }}
          branch: main
          # feat bumps minor and breaking changes major (by default); only
          # fix and perf bump patch. Other types (docs, ci, chore, refactor,
          # test, ...) do not release.
          patchList: fix, perf
          noNewCommitBehavior: current
          noVersionBumpBehavior: current

      - name: Determine version
        id: version
        env:
          INPUT: ${{ inputs.version }}
          CURRENT: ${{ steps.semver.outputs.current }}
          NEXT: ${{ steps.semver.outputs.next }}
          BUMP: ${{ steps.semver.outputs.bump }}
        run: |
          if [ -n "$INPUT" ]; then
            v="$INPUT"
          elif [ -z "$NEXT" ] || [ "$NEXT" = "$CURRENT" ]; then
            echo "No feat, fix, perf or breaking commits since $CURRENT; nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            v="$NEXT"
            if [ "$BUMP" = "major" ]; then
              IFS=. read -r major minor _ <<<"${CURRENT#v}"
              if [ "$major" = "0" ]; then
                # While 0.x, breaking changes bump the minor version; v1.0.0
                # is a deliberate, manual release.
                v="v0.$((minor + 1)).0"
              else
                echo "::error::Breaking changes since $CURRENT need v$((major + 1)) and a /v$((major + 1)) module path; release it by hand."
                exit 1
              fi
            fi
          fi
          if ! [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$v' is not a valid vX.Y.Z version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "::error::tag $v already exists"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing $v" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release notes
        if: steps.version.outputs.version != ''
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.version.outputs.version }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Tag and publish
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$VERSION" --title "$VERSION" --notes-file RELEASE_NOTES.md --verify-tag "${prerelease[@]}"
